#001 — JK BMS RS485 Modbus V1.0
substitutions:
  # RS485-1 / UART1 remains a Modbus slave even with all DIP switches OFF.
  # In that state JK uses device address 0x00 on this port.
  device_addr: "0"
  modbus_controller_update_interval: "10s"
  bms_control_params_update_interval: "100s"

uart:
  - id: uart_0
    baud_rate: 115200
    rx_buffer_size: 384
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

modbus:
  - id: modbus0
    uart_id: uart_0
    turnaround_time: 50ms
    send_wait_time: 250ms
    # flow_control_pin: ${flow_control_pin}

modbus_controller:
  - id: bms0
    # This file targets the left RS485-1 / UART1 connector. The DIP-dependent
    # master/slave rule applies to UART2, not UART1. With all DIP switches OFF,
    # use address 0. If the BMS Device Address was explicitly changed, set that
    # same value in the substitution above.
    address: ${device_addr}
    allow_broadcast_read: true
    modbus_id: modbus0
    setup_priority: -10
    update_interval: ${modbus_controller_update_interval}

  - id: bms0_slow
    address: ${device_addr}
    allow_broadcast_read: true
    modbus_id: modbus0
    setup_priority: -10
    update_interval: ${bms_control_params_update_interval}

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: charging
    name: "charging"
    lambda: |-
      return id(charging_raw).state == 1;

  - platform: template
    id: discharging
    name: "discharging"
    lambda: |-
      return id(discharging_raw).state == 1;

  - platform: template
    id: balancing
    name: "balancing"
    lambda: |-
      return id(balancing_raw).state == 1;

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charging float mode"
    address: 0x1114
    register_type: holding
    bitmask: 0x0200

sensor:
  # 0x1000 0 UINT32 4 RW    VolSmartSleep    mV
  - platform: modbus_controller
    modbus_controller_id: bms0_slow
    name: "smart sleep"
    address: 0x1000
    register_type: holding
    value_type: U_DWORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001


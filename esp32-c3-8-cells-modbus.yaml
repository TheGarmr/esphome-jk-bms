  # 0x120E   14    UINT16    2    R    CellVol7    mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "cell voltage 8"
    address: 0x1207
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1200    0    UINT16*32    64   R    CellVol0..CellVol31    mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "max cell voltage"
    address: 0x1200
    register_type: holding
    value_type: RAW
    response_size: 64
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      uint16_t max_voltage = 0;
      for (int i = 0; i < 32; i++) {
        uint16_t cell_voltage = (data[i*2] << 8) | data[i*2+1];
        if (cell_voltage > max_voltage) max_voltage = cell_voltage;
      }
      return max_voltage * 0.001f;

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "min cell voltage"
    address: 0x1200
    register_type: holding
    value_type: RAW
    response_size: 64
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      uint16_t min_voltage = 0xFFFF;
      for (int i = 0; i < 32; i++) {
        uint16_t cell_voltage = (data[i*2] << 8) | data[i*2+1];
        if (cell_voltage > 500 && cell_voltage < min_voltage) min_voltage = cell_voltage;
      }
      return min_voltage * 0.001f;

  # 0x1248   72    UINT8/UINT8 2  R    MaxVolCellNbr / MinVolCellNbr
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "max voltage cell"
    address: 0x1200
    register_type: holding
    value_type: RAW
    response_size: 64
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      uint16_t max_voltage = 0;
      uint8_t max_cell = 0;
      for (int i = 0; i < 32; i++) {
        uint16_t cell_voltage = (data[i*2] << 8) | data[i*2+1];
        if (cell_voltage > max_voltage) {
          max_voltage = cell_voltage;
          max_cell = i + 1;
        }
      }
      return (float) max_cell;

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "min voltage cell"
    address: 0x1200
    register_type: holding
    value_type: RAW
    response_size: 64
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      uint16_t min_voltage = 0xFFFF;
      uint8_t min_cell = 0;
      for (int i = 0; i < 32; i++) {
        uint16_t cell_voltage = (data[i*2] << 8) | data[i*2+1];
        if (cell_voltage > 500 && cell_voltage < min_voltage) {
          min_voltage = cell_voltage;
          min_cell = i + 1;
        }
      }
      return (float) min_cell;

  # 0x1240   64    UINT32    4    R    CellStatus    (each bit indicates a attached cell)
  # 0x1244   68    UINT16    2    R    CellVolAverage    mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "average cell voltage"
    address: 0x1244
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:

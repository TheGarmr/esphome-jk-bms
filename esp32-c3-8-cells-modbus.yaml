# ----

  # Cell voltages are served from the 32-register block read at 0x1200 (max/min cell voltage),
  # one register per cell, so the address here is 0x1200 + cell index, not the byte offset.
  # 0x1200    0    UINT16    2    R    CellVol0    mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "cell voltage 1"
    address: 0x1200
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x1202    2    UINT16    2    R    CellVol1    mV
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "cell voltage 2"
